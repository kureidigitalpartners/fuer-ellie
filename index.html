<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Für Ellie 💌">
<meta property="og:description" content="Ich hab da eine kleine Frage an dich…">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ellie, eine Frage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Caveat:wght@600;700&family=Courier+Prime&family=PT+Mono&display=swap">
<style>
  /* Layout: one centered step at a time (question → yes → date → plans → sweets → letter → ticket), a hand-drawn cat leading each step, stickers pinned to the edges. Deliberately one pink world in both themes. */
  :root {
    --blush: #ffe3ea;
    --blush-deep: #ffc9d7;
    --ink: #5a2338;
    --cherry: #e8365d;
    --cherry-dark: #b8213f;
    --cream: #fffaf5;
    --lilac: #d9cfe8;
    --muted: #a07a88;
    --font-display: "Fredoka", "Nunito", "Baloo 2", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
    --font-hand: "Caveat", "Bradley Hand", "Segoe Print", cursive;
    --font-type: "Courier Prime", "PT Mono", "Courier New", ui-monospace, monospace;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { min-height: 100%; }
  html { height: 100%; }
  body {
    background:
      radial-gradient(circle at 20% 15%, #fff1f4 0, transparent 40%),
      radial-gradient(circle at 85% 85%, var(--blush-deep) 0, transparent 45%),
      var(--blush);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font-display);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  body.lock { overflow: hidden; height: 100%; }

  .drift { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .drift span { position: absolute; bottom: -40px; color: var(--cherry); opacity: .16; animation: rise linear infinite; }
  @keyframes rise { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(-115vh) rotate(40deg); } }

  .sticker {
    position: fixed; z-index: 1; pointer-events: none;
    filter: drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 6px 8px rgba(90,35,56,.18));
    animation: wobble 4s ease-in-out infinite;
  }
  .sticker svg { display: block; width: 100%; height: auto; }
  .s1 { top: calc(env(safe-area-inset-top, 0px) + 4%); left: max(4%, env(safe-area-inset-left, 0px)); width: 64px; --r: -12deg; }
  .s2 { top: calc(env(safe-area-inset-top, 0px) + 8%); right: max(5%, env(safe-area-inset-right, 0px)); width: 56px; --r: 14deg; animation-delay: -1s; }
  .s3 { bottom: calc(env(safe-area-inset-bottom, 0px) + 6%); left: max(6%, env(safe-area-inset-left, 0px)); width: 58px; --r: 8deg; animation-delay: -2s; }
  .s4 { bottom: calc(env(safe-area-inset-bottom, 0px) + 10%); right: max(4%, env(safe-area-inset-right, 0px)); width: 70px; --r: -8deg; animation-delay: -3s; }
  @keyframes wobble { 0%, 100% { transform: rotate(var(--r)) translateY(0); } 50% { transform: rotate(calc(var(--r) * -0.5)) translateY(-6px); } }
  body:not(.lock) .sticker { opacity: .55; }

  .screen {
    position: relative; z-index: 2;
    min-height: 100%; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center;
    padding-block: 28px;
    animation: enter .45s ease both;
  }
  @keyframes enter { from { transform: translateY(14px); opacity: .4; } to { transform: none; opacity: 1; } }

  .bubble {
    font-family: var(--font-hand); font-size: 1.6rem; line-height: 1.1;
    background: var(--cream); color: var(--ink);
    padding: 8px 18px 10px; border-radius: 22px; border: 3px solid var(--ink);
    position: relative; max-width: 300px; transform: rotate(-2deg); margin-bottom: -6px;
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -12px; width: 18px; height: 18px;
    background: var(--cream); border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink);
    transform: translateX(-50%) rotate(45deg);
  }
  .bubble.pop { animation: pop .35s ease; }
  @keyframes pop { 0% { transform: rotate(-2deg) scale(.85); } 60% { transform: rotate(-2deg) scale(1.08); } 100% { transform: rotate(-2deg) scale(1); } }

  .cat { width: min(200px, 50vw); height: auto; overflow: visible; animation: breathe 3s ease-in-out infinite; }
  .cat.small { width: min(120px, 32vw); }
  @keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.03, .97); } }
  .cat .m, .cat .e, .cat .brows, .cat .tears { display: none; }
  .cat[data-mood="hopeful"] .e-open, .cat[data-mood="hopeful"] .m-smile { display: inline; }
  .cat[data-mood="unsure"] .e-open, .cat[data-mood="unsure"] .m-flat, .cat[data-mood="unsure"] .brows { display: inline; }
  .cat[data-mood="sad"] .e-open, .cat[data-mood="sad"] .m-sad, .cat[data-mood="sad"] .brows { display: inline; }
  .cat[data-mood="crying"] .e-shut, .cat[data-mood="crying"] .m-wail, .cat[data-mood="crying"] .brows, .cat[data-mood="crying"] .tears { display: inline; }
  .cat[data-mood="happy"] .e-happy, .cat[data-mood="happy"] .m-big { display: inline; }
  .cat[data-mood="crying"] .held-heart { animation: shake .4s ease-in-out infinite; transform-origin: 100px 165px; }
  .cat[data-mood="happy"].hop { animation: hop .6s ease-in-out infinite; }
  @keyframes shake { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  @keyframes hop { 0%,100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-22px) scale(1.04, .96); } }
  .tears path { animation: drip 1s ease-in infinite; }
  .tears path:nth-child(2) { animation-delay: .5s; }
  @keyframes drip { from { transform: translateY(0); opacity: 1; } to { transform: translateY(26px); opacity: 0; } }

  h1, h2 { margin: 0; text-wrap: balance; letter-spacing: -.01em; }
  h1 { font-size: clamp(1.9rem, 6.5vw, 3rem); font-weight: 700; line-height: 1.08; max-width: 16ch; }
  h2 { font-size: clamp(1.6rem, 5.5vw, 2.2rem); font-weight: 700; line-height: 1.1; }
  h1 em, h2 em { font-style: normal; color: var(--cherry); }
  .sub { font-family: var(--font-hand); font-size: 1.45rem; margin: -6px 0 0; opacity: .85; max-width: 30ch; text-wrap: balance; line-height: 1.15; }

  .steps { display: flex; gap: 6px; align-items: center; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
  .steps i { width: 8px; height: 8px; border-radius: 50%; background: var(--lilac); border: 2px solid var(--ink); }
  .steps i.on { background: var(--cherry); }

  .buttons { display: flex; gap: 22px; align-items: center; justify-content: center; min-height: 110px; margin-top: 4px; }
  button {
    font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px; cursor: pointer;
    padding: 12px 30px; box-shadow: 0 5px 0 var(--ink);
    transition: transform .18s ease, box-shadow .18s ease, background .2s, color .2s;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  button:focus-visible { outline: 4px dashed var(--cherry); outline-offset: 4px; }
  .primary { background: var(--cherry); color: var(--cream); }
  .primary:hover { background: var(--cherry-dark); }
  .primary:active { box-shadow: 0 1px 0 var(--ink); transform: translateY(4px); }
  .primary:disabled { background: var(--lilac); color: var(--muted); cursor: not-allowed; box-shadow: 0 5px 0 var(--muted); border-color: var(--muted); }
  #yes { transform: scale(var(--s, 1)); transform-origin: center; }
  #yes:active { transform: scale(var(--s, 1)) translateY(4px); }
  #no { background: var(--lilac); white-space: nowrap; transform: scale(var(--ns, 1)); }
  #no.fleeing { position: fixed; z-index: 5; margin: 0; transition: left .28s cubic-bezier(.3,1.4,.5,1), top .28s cubic-bezier(.3,1.4,.5,1), transform .18s ease; }
  #no.giveup { background: var(--cream); }

  /* form card */
  .card {
    width: min(100%, 440px); box-sizing: border-box;
    background: var(--cream); border: 3px solid var(--ink); border-radius: 24px;
    box-shadow: 0 8px 0 var(--ink);
    padding: 18px; display: flex; flex-direction: column; gap: 14px;
  }
  .card-label { font-size: .95rem; font-weight: 600; text-align: left; margin: 0; }

  .cal-head { display: flex; align-items: center; justify-content: space-between; }
  .cal-head strong { font-size: 1.15rem; }
  .icon-btn { padding: 4px 14px; font-size: 1.1rem; box-shadow: 0 3px 0 var(--ink); background: var(--cream); }
  .icon-btn:disabled { opacity: .3; cursor: default; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; font-variant-numeric: tabular-nums; }
  .cal .dow { font-size: .75rem; font-weight: 600; color: var(--muted); padding-bottom: 2px; }
  .day {
    aspect-ratio: 1; max-width: 100%; font: inherit; font-size: 1rem; font-weight: 600;
    border: 2px solid transparent; border-radius: 12px; background: var(--blush); color: var(--ink);
    cursor: pointer; padding: 0; box-shadow: none;
  }
  .day:hover:not(:disabled) { border-color: var(--ink); }
  .day:disabled { background: transparent; color: var(--lilac); cursor: default; }
  .day.today { border-color: var(--cherry); }
  .day.sel { background: var(--cherry); color: var(--cream); border-color: var(--ink); }

  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
  .chip {
    font: inherit; font-size: 1rem; font-weight: 600; text-align: center;
    padding: 10px 8px; border-radius: 16px; border: 2px solid var(--ink); background: var(--cream); color: var(--ink);
    box-shadow: 0 3px 0 var(--ink); cursor: pointer; line-height: 1.2;
  }
  .chip .em { display: block; font-size: 1.5rem; margin-bottom: 2px; }
  .chip[aria-pressed="true"] { background: var(--cherry); color: var(--cream); }
  .chip:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
  .times { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
  .times .chip { font-variant-numeric: tabular-nums; }
  .picked { font-family: var(--font-hand); font-size: 1.5rem; color: var(--cherry-dark); min-height: 1.6rem; margin: 0; }

  /* letter */
  .letter-wrap { position: fixed; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center; background: rgba(90,35,56,.35); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .letter { width: min(100%, 440px); background: var(--cream); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 8px 0 var(--ink); overflow: hidden; animation: enter .4s ease both; }
  .letter header { background: var(--cherry); color: var(--cream); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; font-family: var(--font-type); font-size: .95rem; border-bottom: 3px solid var(--ink); }
  .letter pre { margin: 0; padding: 20px 18px 8px; min-height: 230px; white-space: pre-wrap; font-family: var(--font-type); font-size: 1.02rem; line-height: 1.6; text-align: left; color: var(--ink); }
  .letter pre::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--cherry); }
  .letter.done pre::after { content: ""; }
  @keyframes blink { 50% { opacity: 0; } }
  .letter footer { padding: 6px 18px 18px; display: flex; justify-content: center; }

  /* ticket */
  .ticket {
    width: min(100%, 400px); box-sizing: border-box; text-align: left;
    background: var(--cream); border: 3px solid var(--ink); border-radius: 20px; box-shadow: 0 8px 0 var(--ink);
    position: relative; overflow: hidden;
  }
  .ticket .top { background: var(--cherry); color: var(--cream); padding: 14px 20px; border-bottom: 3px dashed var(--ink); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .ticket .top strong { font-size: 1.3rem; }
  .ticket .top span { font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
  .ticket dl { margin: 0; padding: 16px 20px 20px; display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; }
  .ticket dt { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: var(--muted); padding-top: 3px; }
  .ticket dd { margin: 0; font-weight: 600; font-size: 1.05rem; font-variant-numeric: tabular-nums; min-width: 0; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .ghost { background: var(--cream); }
  .hint { font-size: .95rem; opacity: .75; margin: 0; max-width: 34ch; }
  .copybox { width: min(100%, 400px); font-family: var(--font-type); font-size: .9rem; border: 2px dashed var(--ink); border-radius: 12px; padding: 10px; background: var(--cream); color: var(--ink); resize: none; box-sizing: border-box; }

  /* photo stickers */
  .photo {
    display: block; max-width: 100%; height: auto;
    filter: drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff) drop-shadow(0 8px 10px rgba(90,35,56,.25));
  }
  .pop-bitte {
    position: fixed; z-index: 3; width: min(118px, 30vw); border-radius: 12px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); right: max(14px, env(safe-area-inset-right, 0px));
    animation: popin .5s cubic-bezier(.3,1.6,.5,1) both;
  }
  .pop-rose {
    position: fixed; z-index: 3; width: min(130px, 33vw);
    bottom: env(safe-area-inset-bottom, 0px); left: max(10px, env(safe-area-inset-left, 0px));
    animation: peek .7s cubic-bezier(.3,1.4,.5,1) both;
  }
  @keyframes popin { from { transform: scale(0) rotate(-25deg); } to { transform: scale(1) rotate(8deg); } }
  @keyframes peek { from { transform: translateY(110%) rotate(0deg); } to { transform: translateY(6%) rotate(6deg); } }
  .rose-hero { width: min(270px, 68vw); animation: toss 1.1s cubic-bezier(.2,1.25,.4,1) both; }
  @keyframes toss { from { transform: translate(45vw, 35vh) rotate(30deg) scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
  .hunde { width: min(120px, 32vw); transform: rotate(-6deg); }
  .wir { width: min(230px, 60vw); transform: rotate(-4deg); animation: wiggle 3s ease-in-out infinite; }
  @keyframes wiggle { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(2deg) scale(1.03); } }

  .clip {
    width: min(100%, 400px); box-sizing: border-box; margin: 0;
    background: var(--cream); border: 3px solid var(--ink); border-radius: 20px; box-shadow: 0 8px 0 var(--ink);
    padding: 10px 10px 8px; transform: rotate(1.5deg);
  }
  .clip video { display: block; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; object-fit: cover; border-radius: 12px; background: var(--blush); }
  .clip figcaption { font-family: var(--font-hand); font-size: 1.45rem; line-height: 1.1; padding-top: 6px; }
  .clip small { display: block; font-family: var(--font-display); font-size: .72rem; color: var(--muted); padding-top: 2px; }

  .finale {
    position: fixed; inset: 0; z-index: 6; overflow-y: auto;
    background: rgba(58,20,36,.9);
    display: flex; align-items: center; justify-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: calc(env(safe-area-inset-top, 0px) + 20px) calc(env(safe-area-inset-bottom, 0px) + 20px);
    box-sizing: border-box;
  }
  .finale-inner { display: flex; flex-direction: column; align-items: center; gap: 16px; width: min(100%, 520px); text-align: center; animation: enter .5s ease both; }
  .finale h2 { color: var(--cream); text-shadow: 0 3px 0 var(--ink); }
  .finale .clip { width: 100%; }
  .small-btn { font-size: 1rem; padding: 9px 18px; box-shadow: 0 4px 0 var(--ink); }
  .link-btn {
    display: inline-block; text-decoration: none; color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px; font-family: var(--font-display); font-weight: 600;
  }
  .link-btn:focus-visible { outline: 4px dashed var(--cherry); outline-offset: 4px; }

  .lang {
    position: fixed; z-index: 8; display: flex;
    top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(12px, env(safe-area-inset-right, 0px));
    background: var(--cream); border: 3px solid var(--ink); border-radius: 999px; box-shadow: 0 3px 0 var(--ink); overflow: hidden;
  }
  .lang button {
    border: 0; border-radius: 0; box-shadow: none; padding: 6px 12px; font-size: .9rem; font-weight: 700;
    background: transparent; color: var(--ink); letter-spacing: .06em;
  }
  .lang button[aria-pressed="true"] { background: var(--cherry); color: var(--cream); }
  .lang button:active { transform: none; }

  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 7; }

  @media (max-height: 640px) { .cat { width: min(150px, 40vw); } .screen { gap: 12px; } .sticker { display: none; } }
  @media (max-width: 420px) { .s2, .s3 { display: none; } .s1 { width: 50px; } .s4 { width: 54px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } #no.fleeing { transition: none; } }
</style>

</head>
<body>
<div class="drift" aria-hidden="true" id="drift"></div>
<div class="lang" role="group" aria-label="Sprache / Язык">
  <button type="button" id="lang-de" aria-pressed="true" lang="de">DE</button>
  <button type="button" id="lang-ru" aria-pressed="false" lang="ru">RU</button>
</div>

<div class="sticker s1" aria-hidden="true"><svg viewBox="0 0 100 90"><path d="M50 84 C20 64 4 46 10 26 C16 8 40 6 50 26 C60 6 84 8 90 26 C96 46 80 64 50 84Z" fill="#e8365d" stroke="#5a2338" stroke-width="5" stroke-linejoin="round"/><path d="M24 30 C26 22 32 18 38 19" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".8"/></svg></div>
<div class="sticker s2" aria-hidden="true"><svg viewBox="0 0 100 100"><path d="M50 6 L61 37 L94 38 L68 58 L77 90 L50 71 L23 90 L32 58 L6 38 L39 37Z" fill="#ffd36b" stroke="#5a2338" stroke-width="5" stroke-linejoin="round"/><circle cx="41" cy="52" r="4" fill="#5a2338"/><circle cx="59" cy="52" r="4" fill="#5a2338"/><path d="M44 61 Q50 67 56 61" fill="none" stroke="#5a2338" stroke-width="4" stroke-linecap="round"/></svg></div>
<div class="sticker s3" aria-hidden="true"><svg viewBox="0 0 100 100"><g stroke="#5a2338" stroke-width="5"><circle cx="50" cy="24" r="18" fill="#ffb3c7"/><circle cx="76" cy="44" r="18" fill="#ffb3c7"/><circle cx="66" cy="74" r="18" fill="#ffb3c7"/><circle cx="34" cy="74" r="18" fill="#ffb3c7"/><circle cx="24" cy="44" r="18" fill="#ffb3c7"/><circle cx="50" cy="52" r="14" fill="#ffd36b"/></g></svg></div>
<div class="sticker s4" aria-hidden="true"><svg viewBox="0 0 110 80"><rect x="6" y="8" width="98" height="66" rx="8" fill="#fffaf5" stroke="#5a2338" stroke-width="5"/><path d="M8 12 L55 46 L102 12" fill="none" stroke="#5a2338" stroke-width="5" stroke-linejoin="round"/><path d="M55 58 C46 51 41 46 43 40 C45 35 52 35 55 40 C58 35 65 35 67 40 C69 46 64 51 55 58Z" fill="#e8365d" stroke="#5a2338" stroke-width="3"/></svg></div>

<template id="cat-tpl">
  <svg class="cat" viewBox="0 0 200 200" role="img" aria-label="Eine kleine Katze mit einem Herz">
    <path d="M48 78 L52 26 L88 56Z" fill="#fffaf5" stroke="#5a2338" stroke-width="5" stroke-linejoin="round"/>
    <path d="M152 78 L148 26 L112 56Z" fill="#fffaf5" stroke="#5a2338" stroke-width="5" stroke-linejoin="round"/>
    <path d="M57 62 L59 40 L75 54Z" fill="#ffb3c7"/>
    <path d="M143 62 L141 40 L125 54Z" fill="#ffb3c7"/>
    <ellipse cx="100" cy="118" rx="74" ry="64" fill="#fffaf5" stroke="#5a2338" stroke-width="5"/>
    <ellipse cx="58" cy="122" rx="12" ry="7" fill="#ffb3c7"/>
    <ellipse cx="142" cy="122" rx="12" ry="7" fill="#ffb3c7"/>
    <g class="brows" stroke="#5a2338" stroke-width="4" stroke-linecap="round" fill="none"><path d="M62 88 L82 82"/><path d="M138 88 L118 82"/></g>
    <g class="e e-open">
      <circle cx="74" cy="105" r="11" fill="#5a2338"/><circle cx="126" cy="105" r="11" fill="#5a2338"/>
      <circle cx="78" cy="101" r="4" fill="#fff"/><circle cx="130" cy="101" r="4" fill="#fff"/>
      <circle cx="70" cy="109" r="2" fill="#fff"/><circle cx="122" cy="109" r="2" fill="#fff"/>

      yayTitle: 'Дааааа! 💖', yaySub: 'Ты сказала да. Мой день только что стал лучше.', yayBtn: 'Тогда планируем! →',
      step1: 'Шаг 1 из 3', step2: 'Шаг 2 из 3', step3: 'Шаг 3 из 3',

      prevMonth: 'Предыдущий месяц', nextMonth: 'Следующий месяц', timeLabel: 'Во сколько встретимся?', next: 'Дальше →',
      planTitle: 'Чем будем <em>заниматься</em>?', planSub: 'Выбирай сколько хочешь. Я за любой вариант ✨',
      plans: { market: 'Рождественская ярмарка', dinner: 'Сходить в ресторан', cinema: 'Кино', coffee: 'Кофе и болтовня', skate: 'Покататься на коньках', chiikawa: 'Шопинг с Chiikawa в Miniso', cook: 'Готовить вместе', cozy: 'Плед, фильм и вкусняшки' },
      sweetTitle: 'А чем будем <em>лакомиться</em>?', sweetSub: 'Самый важный вопрос из всех.', sweetBtn: 'Решено 🔒',
      sweets: { crepes: 'Блинчики', almonds: 'Жареный миндаль', waffles: 'Вафли', choc: 'Горячий шоколад', boba: 'Бабл ти', donuts: 'Пончики', icecream: 'Мороженое (всегда можно)', surprise: 'Удиви меня' },
      ticketTitle: 'Договорились! 🥰', ticketHead: 'Наше свидание', ticketNames: 'Элли + Марк', tWhen: 'Когда', tWhat: 'Что', tSweet: 'Сладкое',
      at: t => ', в ' + t,
      ticketHint: 'Отправь мне это, чтобы я всё подготовил. Хватит скриншота, или скопируй ответ.',
      copyBtn: 'Скопировать ответ', rereadBtn: 'Прочитать письмо ещё раз', rewatchBtn: 'Наша песня 🎵',
      copied: 'Скопировано! Теперь просто вставь в чат 💌', copyFallback: 'Выдели текст ниже, скопируй его и вставь в чат.',
      summary: (when, what, sweet) => '💌 Ответ Элли: ДА!\n📅 ' + when + '\n✨ ' + what + '\n🍬 ' + sweet,
      letterFile: '♥ для_тебя.txt', keepBtn: 'Оставлю себе 💗',
      letter: day => 'Элли,\n\nнекоторые вещи слишком милые, чтобы сказать их вслух, поэтому я пишу их здесь.\n\nС тех пор как мы познакомились, я довольно часто думаю о тебе. И ' + day + ' уже сейчас мой любимый день.\n\nЖду встречи с тобой.\n\n                     Марк',
      finaleTitle: 'И напоследок… 🖤💜', clipCaption: 'Наша песня. Включи звук и нажми play 🎵',
      musicOff: '♪ Выключить шкатулку', musicOn: '♪ Включить шкатулку', songLink: 'Наша песня: Secrets ↗', toTicket: 'К нашему свиданию →',
    },
  };
  let lang = 'de';
  try { if (localStorage.getItem('ellie-lang') === 'ru') lang = 'ru'; } catch (e) {}
  const L = () => T[lang];
  const langHooks = [];
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = L()[el.dataset.t]; });
    document.querySelectorAll('[data-t-aria]').forEach(el => { el.setAttribute('aria-label', L()[el.dataset.tAria]); });
    $('lang-de').setAttribute('aria-pressed', String(lang === 'de'));
    $('lang-ru').setAttribute('aria-pressed', String(lang === 'ru'));
    langHooks.forEach(fn => fn());
  }
  function setLang(l) {
    lang = l;
    try { localStorage.setItem('ellie-lang', l); } catch (e) {}
    applyLang();
  }
  $('lang-de').addEventListener('click', () => setLang('de'));
  $('lang-ru').addEventListener('click', () => setLang('ru'));
  const tpl = $('cat-tpl');
  const cats = {};
  document.querySelectorAll('.cat-slot').forEach(slot => {
    const svg = tpl.content.firstElementChild.cloneNode(true);
    svg.dataset.mood = slot.dataset.mood;
    if (slot.dataset.hop) svg.classList.add('hop');
    if (slot.dataset.small) svg.classList.add('small');
    slot.appendChild(svg);
    if (slot.dataset.id) cats[slot.dataset.id] = svg;
  });
  const cat = cats.askcat;

  const drift = $('drift');
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('span');
    s.textContent = '♥';
    s.style.left = Math.random() * 100 + '%';
    s.style.fontSize = (14 + Math.random() * 26) + 'px';
    s.style.animationDuration = (9 + Math.random() * 10) + 's';
    s.style.animationDelay = (-Math.random() * 18) + 's';
    drift.appendChild(s);
  }

  document.body.classList.add('lock');
  function show(id) {
    document.querySelectorAll('.screen').forEach(s => { s.hidden = s.id !== id; });
    document.body.classList.toggle('lock', id === 's-ask');
    scrollTo(0, 0);
  }
  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => show(b.dataset.go)));

  /* ---------- question with the runaway "Nein" ---------- */
  const yes = $('yes'), no = $('no'), bubble = $('bubble');
  const MAX = T.de.no.length;
  let tries = 0, gaveUp = false, pointer = { x: -999, y: -999 };
  const moodFor = n => n === 0 ? 'hopeful' : n < 3 ? 'unsure' : n < 6 ? 'sad' : 'crying';
  function say(t) { bubble.textContent = t; bubble.classList.remove('pop'); void bubble.offsetWidth; bubble.classList.add('pop'); }
  const overlaps = (a, b, p) => !(a.right + p < b.left || a.left - p > b.right || a.bottom + p < b.top || a.top - p > b.bottom);

  function moveNo() {
    const r = no.getBoundingClientRect();
    if (!no.classList.contains('fleeing')) {
      no.style.left = r.left + 'px'; no.style.top = r.top + 'px';
      no.classList.add('fleeing'); void no.offsetWidth;
    }
    const w = no.offsetWidth, h = no.offsetHeight, m = 16;
    const maxX = Math.max(m, innerWidth - w - m), maxY = Math.max(m, innerHeight - h - m);
    const yr = yes.getBoundingClientRect();
    const avoid = [yr, bubble.getBoundingClientRect(), cat.getBoundingClientRect()];
    ['pop-bitte', 'pop-rose'].forEach(id => { if (!$(id).hidden) avoid.push($(id).getBoundingClientRect()); });
    const clear = box => avoid.every(a => !overlaps(box, a, 16));
    let best = null;
    for (let i = 0; i < 40; i++) {
      const x = m + Math.random() * (maxX - m), y = m + Math.random() * (maxY - m);
      const box = { left: x, top: y, right: x + w, bottom: y + h };
      const far = Math.hypot(x + w / 2 - pointer.x, y + h / 2 - pointer.y) > 140;
      const jump = Math.hypot(x - r.left, y - r.top) > 90;
      if (clear(box) && far && jump) { best = { x, y }; break; }
      if (!best && !overlaps(box, yr, 24)) best = { x, y };
    }
    if (best) { no.style.left = best.x + 'px'; no.style.top = best.y + 'px'; }
  }

  function flee(e) {
    if (gaveUp) return;
    if (e) { const p = e.touches ? e.touches[0] : e; if (p && p.clientX != null) pointer = { x: p.clientX, y: p.clientY }; }
    tries++;
    if (tries >= MAX) {
      gaveUp = true;
      no.textContent = L().noGiveUp;
      no.classList.add('giveup');
      say(L().lineGiveUp);
      cat.dataset.mood = 'hopeful';
      no.style.setProperty('--ns', 1);
      requestAnimationFrame(() => {
        const r = no.getBoundingClientRect();
        no.style.left = Math.min(Math.max(16, r.left), innerWidth - no.offsetWidth - 16) + 'px';
        no.style.top = Math.min(Math.max(16, r.top), innerHeight - no.offsetHeight - 16) + 'px';
      });
      return;
    }
    no.textContent = L().no[tries];
    say(L().lines[tries]);
    if (tries === 4) $('pop-bitte').hidden = false;
    if (tries === 6) $('pop-rose').hidden = false;
    cat.dataset.mood = moodFor(tries);
    yes.style.setProperty('--s', Math.min(1.9, 1 + tries * 0.1));
    no.style.setProperty('--ns', Math.max(0.72, 1 - tries * 0.03));
    moveNo();
  }
  no.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') flee(e); });
  no.addEventListener('touchstart', e => { if (!gaveUp) { e.preventDefault(); flee(e); } }, { passive: false });
  no.addEventListener('click', e => { if (gaveUp) { saidYes(); return; } e.preventDefault(); flee(e); });
  addEventListener('resize', () => { if (no.classList.contains('fleeing') && !gaveUp && !$('s-ask').hidden) moveNo(); });
  yes.addEventListener('click', saidYes);
  langHooks.push(() => {
    no.textContent = gaveUp ? L().noGiveUp : L().no[tries];
    bubble.textContent = gaveUp ? L().lineGiveUp : L().lines[tries];
  });
  function saidYes() { no.hidden = true; show('s-yay'); confetti(1); }

  /* ---------- date + time ---------- */
  const today = new Date(); today.setHours(0, 0, 0, 0);
  let view = new Date(today.getFullYear(), today.getMonth(), 1);
  const lastMonth = new Date(today.getFullYear(), today.getMonth() + 3, 1);
  const state = { date: null, time: null, plans: new Set(), sweets: new Set() };
  const fmtDay = d => d.toLocaleDateString(L().locale, { weekday: 'long', day: 'numeric', month: 'long' });

  function renderCal() {
    $('month').textContent = view.toLocaleDateString(L().locale, { month: 'long', year: 'numeric' });
    $('prev').disabled = view <= new Date(today.getFullYear(), today.getMonth(), 1);
    $('next').disabled = view >= lastMonth;
    const cal = $('cal'); cal.innerHTML = '';
    L().dows.forEach(d => { const e = document.createElement('div'); e.className = 'dow'; e.textContent = d; cal.appendChild(e); });
    const offset = (view.getDay() + 6) % 7;
    for (let i = 0; i < offset; i++) cal.appendChild(document.createElement('div'));
    const days = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
    for (let n = 1; n <= days; n++) {
      const d = new Date(view.getFullYear(), view.getMonth(), n);
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'day'; b.textContent = n;
      b.setAttribute('aria-label', fmtDay(d));
      if (d < today) b.disabled = true;
      if (+d === +today) b.classList.add('today');
      if (state.date && +d === +state.date) b.classList.add('sel');
      b.addEventListener('click', () => {
        state.date = d; renderCal();
        $('picked').textContent = fmtDay(d) + ' 💕';
        $('time-label').hidden = false; $('times').hidden = false;
        checkDate();
      });
      cal.appendChild(b);
    }
  }
  $('prev').addEventListener('click', () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); renderCal(); });
  $('next').addEventListener('click', () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); renderCal(); });

  // items: [emoji, key]; labelOf(key) gives the text in the current language
  function chipGroup(el, items, onPick, multi, labelOf) {
    const paint = () => el.querySelectorAll('.chip').forEach(b => {
      b.innerHTML = (b.dataset.em ? '<span class="em" aria-hidden="true">' + b.dataset.em + '</span>' : '') + labelOf(b.dataset.key);
    });
    items.forEach(([em, key]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.setAttribute('aria-pressed', 'false');
      b.dataset.key = key; b.dataset.em = em;
      b.addEventListener('click', () => {
        if (!multi) el.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
        const on = multi ? b.getAttribute('aria-pressed') !== 'true' : true;
        b.setAttribute('aria-pressed', String(on));
        onPick(key, on);
      });
      el.appendChild(b);
    });
    paint(); langHooks.push(paint);
  }
  chipGroup($('times'), [['', '12:00'], ['', '14:30'], ['', '16:00'], ['', '18:00'], ['', '19:30'], ['', '20:30']],
    t => { state.time = t; checkDate(); }, false, k => k);
  function checkDate() { $('date-next').disabled = !(state.date && state.time); }
  $('date-next').addEventListener('click', () => show('s-plan'));

  /* ---------- plans + sweets ---------- */
  chipGroup($('plans'), [
    ['🎄', 'market'], ['🍝', 'dinner'], ['🎬', 'cinema'], ['☕', 'coffee'],
    ['⛸️', 'skate'], ['🧸', 'chiikawa'], ['🍳', 'cook'], ['🛋️', 'cozy'],
  ], (k, on) => { on ? state.plans.add(k) : state.plans.delete(k); $('plan-next').disabled = !state.plans.size; }, true, k => L().plans[k]);
  $('plan-next').addEventListener('click', () => show('s-sweet'));

  chipGroup($('sweets'), [
    ['🥞', 'crepes'], ['🥜', 'almonds'], ['🧇', 'waffles'], ['🍫', 'choc'],
    ['🧋', 'boba'], ['🍩', 'donuts'], ['🍦', 'icecream'], ['🍬', 'surprise'],
  ], (k, on) => { on ? state.sweets.add(k) : state.sweets.delete(k); $('sweet-next').disabled = !state.sweets.size; }, true, k => L().sweets[k]);

  /* ---------- letter ---------- */
  let typing = null;
  function letterText() {
    return L().letter(fmtDay(state.date));
  }
  function openLetter() {
    $('letter-wrap').hidden = false;
    const pre = $('letter-text'), box = $('letter'), full = letterText();
    box.classList.remove('done'); pre.textContent = '';
    let i = 0; clearInterval(typing);
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { pre.textContent = full; box.classList.add('done'); return; }
    typing = setInterval(() => {
      pre.textContent = full.slice(0, ++i);
      if (i >= full.length) { clearInterval(typing); box.classList.add('done'); }
    }, 38);
  }
  $('letter').addEventListener('click', e => {
    if (e.target.id === 'keep') return;
    clearInterval(typing); $('letter-text').textContent = letterText(); $('letter').classList.add('done');
  });
  $('sweet-next').addEventListener('click', () => { fillTicket(); show('s-ticket'); openLetter(); });
  $('keep').addEventListener('click', () => { clearInterval(typing); $('letter-wrap').hidden = true; openFinale(); });
  $('rewatch').addEventListener('click', openFinale);

  /* ---------- finale: clip + self-made music box ---------- */
  function openFinale() {
    $('finale').hidden = false;
    confetti(0.6);
    setMusicLabel();
  }
  $('to-ticket').addEventListener('click', () => { $('finale').hidden = true; box.stop(); });
  $('music').addEventListener('click', () => { box.playing ? box.stop() : box.start(); setMusicLabel(); });
  function setMusicLabel() {
    $('music').textContent = box.playing ? L().musicOff : L().musicOn;
    $('music').setAttribute('aria-pressed', String(box.playing));
  }

  // An original little lullaby, played like a music box (Web Audio, no files).
  const box = (() => {
    const N = n => 440 * Math.pow(2, (n - 69) / 12);
    // [midi note, beats]; 0 = rest
    const melody = [
      [76,1],[79,1],[84,1],[83,1], [81,1],[79,1],[76,2],
      [77,1],[81,1],[86,1],[84,1], [83,1],[79,1],[0,2],
      [76,1],[79,1],[84,1],[88,1], [86,1],[84,1],[81,1],[79,1],
      [77,1],[76,1],[74,1],[79,1], [72,3],[0,1],
    ];
    const bass = [48, 55, 53, 55, 48, 53, 50, 48]; // one per bar
    const beat = 0.42;
    let ctx = null, master = null, timer = null, next = 0, step = 0, bar = 0;
    const api = { playing: false };
    function bell(freq, t, len, vol) {
      [[1, 1], [2, .35], [3, .12]].forEach(([mult, g]) => {
        const o = ctx.createOscillator(), a = ctx.createGain();
        o.type = 'sine'; o.frequency.value = freq * mult;
        a.gain.setValueAtTime(0, t);
        a.gain.linearRampToValueAtTime(vol * g, t + 0.01);
        a.gain.exponentialRampToValueAtTime(0.0001, t + len);
        o.connect(a); a.connect(master); o.start(t); o.stop(t + len + 0.05);
      });
    }
    function schedule() {
      while (next < ctx.currentTime + 0.3) {
        const [n, b] = melody[step];
        if (n) bell(N(n), next, Math.max(1.2, b * beat * 2), 0.22);
        if (step % 4 === 0 || (melody[step][1] > 1 && step === 0)) { /* bass on bar starts below */ }
        next += b * beat;
        step = (step + 1) % melody.length;
      }
    }
    // bass is scheduled alongside: every 4 beats
    let bassNext = 0;
    function scheduleBass() {
      while (bassNext < ctx.currentTime + 0.3) {
        bell(N(bass[bar % bass.length]), bassNext, 2.2, 0.12);
        bassNext += 4 * beat; bar++;
      }
    }
    api.start = () => {
      try {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
          ctx = new AC(); master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination);
        }
        if (ctx.state === 'suspended') ctx.resume();
        if (api.playing) return;
        master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(0.8, ctx.currentTime);
        next = bassNext = ctx.currentTime + 0.1; step = 0; bar = 0;
        timer = setInterval(() => { schedule(); scheduleBass(); }, 100);
        api.playing = true;
      } catch (e) {}
    };
    api.stop = () => {
      if (!ctx || !api.playing) return;
      clearInterval(timer); api.playing = false;
      master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
      master.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.6);
    };
    return api;
  })();
  $('reread').addEventListener('click', openLetter);

  /* ---------- ticket ---------- */
  const whenText = () => fmtDay(state.date) + L().at(state.time);
  const whatText = () => [...state.plans].map(k => L().plans[k]).join(', ');
  const sweetText = () => [...state.sweets].map(k => L().sweets[k]).join(', ');
  function summary() { return L().summary(whenText(), whatText(), sweetText()); }
  function fillTicket() {
    if (!state.date) return;
    $('t-when').textContent = whenText();
    $('t-what').textContent = whatText();
    $('t-sweet').textContent = sweetText();
  }
  $('copy').addEventListener('click', () => {
    const text = summary(), msg = $('copy-msg');
    const fallback = () => {
      const box = $('copybox'); box.value = text; box.hidden = false; box.focus(); box.select();
      msg.textContent = L().copyFallback; msg.hidden = false;
    };
    try {
      navigator.clipboard.writeText(text).then(() => {
        msg.textContent = L().copied; msg.hidden = false;
      }, fallback);
    } catch (e) { fallback(); }
  });

  langHooks.push(() => {
    renderCal();
    if (state.date) $('picked').textContent = fmtDay(state.date) + ' 💕';
    fillTicket();
    $('copy-msg').hidden = true; $('copybox').hidden = true;
    setMusicLabel();
    if (!$('letter-wrap').hidden) { clearInterval(typing); $('letter-text').textContent = letterText(); $('letter').classList.add('done'); }
  });
  applyLang();

  /* ---------- confetti ---------- */
  const c = $('confetti'), ctx = c.getContext('2d');
  const size = () => { const dpr = Math.min(2, devicePixelRatio || 1); c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  size(); addEventListener('resize', size);
  const glyphs = ['💖', '💕', '💗', '✨', '🌸', '🥰', '♥'];
  const parts = []; let running = false, rainLeft = 0;
  function confetti(amount) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for (let i = 0; i < 60 * amount; i++) {
      const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 9;
      parts.push({ x: innerWidth / 2, y: innerHeight / 2, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 6,
        g: glyphs[(Math.random() * glyphs.length) | 0], s: 16 + Math.random() * 22, r: Math.random() * 6, vr: (Math.random() - .5) * .2 });
    }
    rainLeft = Math.max(rainLeft, Math.round(45 * amount));
    if (!running) { running = true; requestAnimationFrame(frame); }
  }
  function frame() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    if (rainLeft > 0 && Math.random() < .25) {
      rainLeft--;
      for (let i = 0; i < 2; i++) parts.push({ x: Math.random() * innerWidth, y: -30, vx: (Math.random() - .5) * 1.5, vy: 1 + Math.random() * 2,
        g: glyphs[(Math.random() * glyphs.length) | 0], s: 14 + Math.random() * 18, r: 0, vr: (Math.random() - .5) * .05 });
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.vy += 0.18; p.vx *= 0.99; if (p.vy > 3.2) p.vy = 3.2 + (p.vy - 3.2) * 0.9;
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.font = p.s + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#e8365d';
      ctx.fillText(p.g, 0, 0); ctx.restore();
      if (p.y > innerHeight + 40) parts.splice(i, 1);
    }
    if (parts.length || rainLeft > 0) requestAnimationFrame(frame); else { running = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }
})();
</script>

</body>
